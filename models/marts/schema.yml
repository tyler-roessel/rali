version: 2

models:
  - name: dim_account
    description: >
      One row per resolved account. Account identity, address, chain flag and
      territory are real/derived; the website signals are observed; the
      fit_score is a rules-based rubric, not a prediction.
    columns:
      - name: account_id
        description: "uuid5(dedup_key); joins to lifecycle events."
        tests:
          - unique
          - not_null
      - name: fit_score
        description: "0-100 rubric; practical maximum is 90 because ordering and delivery-only are mutually exclusive."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: territory
        description: "Coarse Chicago territory from postcode/city; Unknown when both are missing."
        tests:
          - not_null
      - name: signal_confidence
        description: "confirmed, unknown_no_match, or unknown_unreachable."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["confirmed", "unknown_no_match", "unknown_unreachable"]
      - name: is_chain
        description: "True for curated chain aliases."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: fct_lifecycle_event
    description: >
      Synthetic event spine, one row per event. Incremental delete+insert on
      event_id. The events are generated, not real CRM history.
    columns:
      - name: event_id
        description: "Deterministic uuid5 event id."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Account that generated the event."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: event_name
        description: "One of the eight lifecycle stage/event names."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["prospect_created", "demo_booked", "closed_won", "onboarded", "first_order", "30_day_active", "support_ticket", "renewal_due"]
      - name: source_system
        description: "Always synthetic."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["synthetic"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["account_id", "event_name"]

  - name: fct_account_health
    description: >
      One row per account (including accounts with no lifecycle events).
      Adoption, support and renewal risk are rules-based.
    columns:
      - name: account_id
        description: "Account key."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: adoption_score
        description: "0-100 rules score; 0 for accounts with no onboarding."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: support_risk
        description: "high, medium, or low."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: renewal_risk
        description: "high, medium, or low."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]

  - name: mart_sales_queue
    description: >
      Ranked independent-account sales queue. signal_confidence and
      failure_class are top-level so a reviewer sorting by fit_score sees the
      evidence state inline.
    columns:
      - name: account_id
        description: "Account key."
        tests:
          - unique
          - not_null
      - name: rank
        description: "Sales rank by fit_score."
        tests:
          - unique
          - not_null
      - name: fit_score
        description: "0-100 rubric."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: signal_confidence
        description: "Account-level homepage signal confidence."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["confirmed", "unknown_no_match", "unknown_unreachable"]
      - name: signal_coverage_pct
        description: "Share of this queue with confirmed homepage signals, repeated per row."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_cs_queue
    description: >
      Customer-success queue. One row per onboarded account.
      signal_confidence and failure_class are top-level; signal_coverage_pct is
      the queue's confirmed-signal share repeated per row.
    columns:
      - name: account_id
        description: "Account key."
        tests:
          - unique
          - not_null
      - name: cs_rank
        description: "CS rank by support/renewal risk then adoption."
        tests:
          - unique
          - not_null
      - name: adoption_score
        description: "0-100 rules score."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: support_risk
        description: "high, medium, or low."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: renewal_risk
        description: "high, medium, or low."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: signal_confidence
        description: "Account-level homepage signal confidence."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["confirmed", "unknown_no_match", "unknown_unreachable"]
      - name: signal_coverage_pct
        description: "Share of this queue with confirmed homepage signals, repeated per row."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_handoff_exceptions
    description: >
      Synthetic closed-won accounts with no onboarding event. Territory maps
      to a demo CX owner key; no real employee or Slack identity is stored.
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: notification_key
        tests:
          - unique
          - not_null
      - name: owner_key
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cx_downtown", "cx_north", "cx_south", "cx_triage"]
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["synthetic"]
      - name: closed_won_at
        tests:
          - not_null

  - name: funnel_summary
    description: >
      Six-stage funnel with raw counts, stage-to-stage conversion and median
      days between stages. Synthetic lifecycle output.
    columns:
      - name: stage_name
        description: "Lifecycle stage name."
        tests:
          - unique
          - not_null

  - name: mart_lifecycle_funnel
    description: >
      CRM lifecycle funnel built from the raw event mapping. Lead, SQL,
      Opportunity, Customer and Active are counted as distinct accounts that
      reached the stage; post-sale activity is mapped to Active but does not
      create an additional stage arrival.
    columns:
      - name: lifecycle_stage
        description: "CRM stage name."
        tests:
          - unique
          - not_null
      - name: stage_order
        description: "Lead=1 through Active=5."
        tests:
          - unique
          - not_null
      - name: accounts_reached
        description: "Distinct accounts that reached the stage."
        tests:
          - not_null
      - name: conversion_from_previous
        description: "Stage conversion from the prior stage; null for Lead."
        tests:
          - between:
              arguments:
                min_value: 0
                max_value: 1
      - name: conversion_from_lead
        description: "Stage conversion from Lead."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 1

  - name: crm_identity_map
    description: >
      Warehouse-to-CRM identity map. The waterfall is exact domain, exact
      phone+address, then fuzzy name+geo. Candidate matches below 95%
      confidence are flagged needs_human_review; unmatched accounts have a
      null crm_account_id and match_method='unmatched'.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_matched or match_confidence >= 95 or needs_human_review"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_matched = (crm_account_id is not null)"
    columns:
      - name: account_id
        description: "Warehouse account key."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: crm_account_id
        description: "CRM account key; null when unmatched."
        tests:
          - relationships:
              arguments:
                to: ref('mock_crm_accounts')
                field: crm_account_id
      - name: match_method
        description: "exact_domain, exact_phone_address, fuzzy_name_geo, or unmatched."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_domain", "exact_phone_address", "fuzzy_name_geo", "unmatched"]
      - name: match_confidence
        description: "0-100 confidence; exact matches are 100."
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: needs_human_review
        description: "True for candidate matches below 95% confidence."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_matched
        description: "True when a CRM account was assigned."
        tests:
          - not_null
