version: 2

seeds:
  - name: handoff_owner_routing
    description: >
      Illustrative territory-to-CX-owner routing for synthetic handoff alerts.
      Owner keys are roles, not real Popmenu employees or Slack identities.
    columns:
      - name: territory
        tests:
          - unique
          - not_null
      - name: owner_key
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cx_downtown", "cx_north", "cx_south", "cx_triage"]

  - name: mock_crm_accounts
    description: >
      Dallas mock CRM generated by scripts/build_dallas_mock_crm.py from 50
      sampled dim_account rows, spread across the resolver's three matching
      branches. Not the reverse-ETL mock (mock_crm_records.json).
    columns:
      - name: crm_account_id
        tests:
          - unique
          - not_null
      - name: crm_name
        tests:
          - not_null

  - name: crm_identity_resolution
    description: >
      Output of scripts/resolve_identities.py. One row per dim_account; null
      crm_account_id means unmatched. A candidate below 95% confidence is
      flagged for human review.
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: match_method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_domain", "exact_phone_address", "fuzzy_name_geo", "unmatched"]
      - name: match_confidence
        tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                max_value: 100
      - name: needs_human_review
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
