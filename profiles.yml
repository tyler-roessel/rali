rali:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('SUPABASE_HOST') }}"          # aws-0-<region>.pooler.supabase.com (session pooler)
      port: 5432
      user: "{{ env_var('SUPABASE_USER') }}"          # postgres.<project-ref>, not plain postgres
      pass: "{{ env_var('SUPABASE_DB_PASSWORD') }}"
      dbname: postgres
      schema: dbt_dev
      threads: 4
      connect_timeout: 15
      sslmode: require
